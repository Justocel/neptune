services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: neptune-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neptune}
      POSTGRES_USER: ${POSTGRES_USER:-neptune}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - neptune-pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neptune} -d ${POSTGRES_DB:-neptune}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  neptune-pgdata:
